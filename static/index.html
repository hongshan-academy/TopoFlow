<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TopoFlow 综合工具</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: #fffaf1;
        --ink: #1b1f23;
        --muted: #5f6772;
        --line: #d7cdbf;
        --accent: #19324d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.65), transparent 28%),
          linear-gradient(135deg, #efe2c7, var(--bg));
      }

      .layout {
        height: 100vh;
        display: grid;
        grid-template-columns: 280px 1fr 300px;
        gap: 16px;
        padding: 16px;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(72, 55, 24, 0.08);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .controls, .inspector {
        padding: 18px;
        overflow-y: auto;
      }

      /* 让左侧和右侧面板的内容自适应填满 */
      .controls { overscroll-behavior: contain; }
      .inspector { overscroll-behavior: contain; }

      h1, h2 { margin: 0 0 12px; font-size: 20px; }
      .subtitle { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
      .control-group { display: grid; gap: 10px; margin-bottom: 18px; }
      .tool-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
      }
      .continuous-label { color: #0f766e; font-weight: 700; }
      .inline-input { display: grid; gap: 8px; }

      .solver-group {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f4ebdd;
      }
      .solver-group .solver-toggle { font-weight: 700; }

      .solver-options {
        display: grid;
        gap: 8px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fffaf1;
      }
      .solver-options.inline-row {
        grid-template-columns: minmax(0, 1fr) 96px;
        align-items: end;
      }
      .solver-options.inline-row .inline-input { gap: 4px; }
      .solver-options legend {
        padding: 0 4px;
        color: var(--muted);
        font-size: 13px;
      }
      .solver-options label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        line-height: 1.35;
      }
      .solver-options .inline-input {
        display: grid;
        gap: 4px;
      }
      .solver-options .inline-input span { white-space: nowrap; }
      .stack { display: grid; gap: 10px; }

      button, input[type="range"], input[type="number"],
      input[type="text"], select { width: 100%; }

      input[type="number"], input[type="text"], select {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        background: white;
        color: var(--ink);
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 11px 14px;
        background: var(--accent);
        color: white;
        cursor: pointer;
      }
      button.secondary { background: #8b6f47; }
      button.is-active { background: #0f766e; }

      .stat-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .stat-row:last-child { border-bottom: 0; }
      .initial-state-row { display: none; }

      .radio-row { display: flex; gap: 8px; }
      .radio-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
      }
      .radio-pill input { width: auto; margin: 0; }
      .stat-key { color: var(--muted); }
      .graph-panel { overflow: hidden; position: relative; flex: 1; }
      .graph-header { padding: 18px 18px 0; }
      .graph-wrap {
        padding: 10px 12px 12px;
        flex: 1;
        display: flex;
        min-height: 0;
      }

      svg {
        width: 100%;
        height: 100%;
        border-radius: 16px;
        user-select: none;
        -webkit-user-select: none;
        background:
          linear-gradient(rgba(25, 50, 77, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(25, 50, 77, 0.04) 1px, transparent 1px),
          linear-gradient(180deg, #fffdf7, #f8f1e3);
        background-size: 28px 28px, 28px 28px, auto;
        border: 1px solid var(--line);
      }

      .edge-hit {
        fill: none;
        stroke: transparent;
        stroke-width: 18;
        cursor: pointer;
      }
      .edge-line {
        fill: none;
        stroke: #16a34a;
        stroke-width: 3;
        marker-end: url(#arrow);
        transition: stroke 100ms ease, stroke-width 100ms ease;
      }
      .edge-group.is-active .edge-line { stroke-width: 5; }
      .edge-group.is-selected .edge-line {
        stroke-width: 5;
        filter: drop-shadow(0 0 3px rgba(22, 163, 74, 0.95));
      }
      .edge-group.is-semi .edge-line { stroke: #ea580c; }
      .edge-group.is-semi.is-selected .edge-line {
        filter: drop-shadow(0 0 3px rgba(234, 88, 12, 0.95));
      }
      .edge-group.is-blocked .edge-line { stroke: #dc2626; }
      .edge-group.is-blocked.is-selected .edge-line {
        filter: drop-shadow(0 0 3px rgba(220, 38, 38, 0.95));
      }
      .graph-boundary {
        fill: none;
        stroke: #8b6f47;
        stroke-width: 3;
        stroke-dasharray: 16 12;
        pointer-events: none;
      }
      .edge-flow {
        fill: #1f2937;
        font-size: 11px;
        font-weight: 700;
        pointer-events: none;
      }
      .edge-flow-continuous { fill: #0f766e; }
      .edge-flow-sim { fill: #b45309; }
      .node { cursor: pointer; }
      .node circle {
        stroke: rgba(255, 255, 255, 0.78);
        stroke-width: 3;
        transition: transform 120ms ease, stroke-width 120ms ease, filter 120ms ease;
      }
      .node text {
        fill: white;
        font-size: 12px;
        font-weight: 600;
        pointer-events: none;
      }
      .node .node-type { font-size: 10px; font-weight: 500; opacity: 0.92; }
      .node .node-flow {
        fill: #1f2937;
        font-size: 11px;
        font-weight: 700;
      }
      .node .node-flow-continuous { fill: #0f766e; }
      .node.is-selected circle {
        stroke: #111827;
        stroke-width: 5;
      }
      .node.is-edge-start circle {
        stroke: #0f766e;
        stroke-width: 5;
      }
      .node.has-item circle {
        filter: drop-shadow(0 0 10px rgba(255, 214, 10, 0.7));
      }

      .history-box {
        margin-top: 14px;
        padding: 12px;
        border-radius: 12px;
        background: #f4ebdd;
        border: 1px solid var(--line);
        font-family: Consolas, "Courier New", monospace;
        word-break: break-all;
        min-height: 96px;
      }
      .history-meta {
        margin-top: 10px;
        color: var(--muted);
        line-height: 1.5;
      }
      .status-box { display: none; }

      .app-toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translate(-50%, 24px);
        max-width: min(80vw, 640px);
        padding: 14px 20px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.45;
        color: white;
        background: #1b1f23;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease;
        z-index: 1000;
      }
      .app-toast-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .app-toast-error { background: #b3261e; }
      .app-toast-info { background: #19324d; }

      @media (max-width: 1100px) {
        .layout {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100vh;
        }
        .graph-wrap { min-height: 400px; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="panel controls">
        <div class="control-group">
          <div class="stat-row">
            <span class="stat-key">图规模</span>
            <strong id="graph-stats">0 个节点 / 0 条边</strong>
          </div>
        </div>

        <div class="control-group">
          <div class="tool-grid">
            <button data-mode-button="select" class="secondary">选择 `Esc/X`</button>
            <button data-mode-button="edge">连边 `E`</button>
            <button data-mode-button="add-S">S `1`</button>
            <button data-mode-button="add-C">C `2`</button>
            <button data-mode-button="add-In" class="secondary">In `3`</button>
            <button data-mode-button="add-Out" class="secondary">Out `4`</button>
          </div>
        </div>

        <div class="control-group">
          <div class="solver-group">
            <label class="stat-key" for="solver-model" style="font-size:13px">求解模型</label>
            <select id="solver-model" style="width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-size:13px">
              <option value="milp">MILP (Z3, exact)</option>
            </select>
            <div class="solver-options" style="display:grid;gap:8px;margin-top:8px">
              <div class="buttons">
                <button id="solve-btn">求解</button>
              </div>
              <div id="three-state-controls">
                <div class="buttons" style="margin-top:4px">
                  <button id="flow-prev-btn" class="secondary">上一流量</button>
                  <button id="flow-next-btn" class="secondary">下一流量</button>
                </div>
                <div class="buttons" style="margin-top:4px">
                  <button id="state-prev-btn" class="secondary">上一状态</button>
                  <button id="state-next-btn" class="secondary">下一状态</button>
                </div>
                <div class="stat-row">
                  <span class="stat-key">当前流量</span>
                  <strong id="flow-counter">0 / 0</strong>
                </div>
                <div class="stat-row">
                  <span class="stat-key">当前状态</span>
                  <strong id="state-counter">0 / 0</strong>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="control-group">
          <h2>离散仿真</h2>
          <div class="solver-options" style="display:grid;gap:8px">
            <div class="buttons">
              <button id="sim-run-btn">运行仿真</button>
              <button id="sim-play-btn" class="secondary">播放</button>
            </div>
            <div class="buttons">
              <button id="sim-prev-btn" class="secondary">上一帧</button>
              <button id="sim-next-btn" class="secondary">下一帧</button>
            </div>
            <input id="sim-frame-slider" type="range" min="0" max="0" value="0" />
            <div class="stat-row">
              <span class="stat-key">当前帧</span>
              <strong id="sim-frame-value">0 / 0</strong>
            </div>
            <div class="solver-options inline-row">
              <div class="inline-input">
                <span>播放帧率</span>
                <input id="sim-fps" type="number" min="1" max="240" value="8" />
              </div>
              <div class="inline-input">
                <span>最大帧数</span>
                <input id="sim-auto-frames" type="number" min="1" value="5000" />
              </div>
            </div>
            <div id="sim-status" style="font-size:13px;color:var(--muted);min-height:1.2em"></div>
          </div>
        </div>

        <div class="buttons">
          <button id="clear-btn" class="secondary">清空</button>
        </div>

        <div class="control-group">
          <h2>wg 格式导入/导出</h2>
          <textarea id="wg-input" rows="5" placeholder='每行一条边 "from -> to"，例如 "S3_5 -> C3_2"（支持 # 注释）' style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:white;color:var(--ink);font-family:Consolas,monospace;font-size:12px;resize:vertical"></textarea>
          <div class="buttons" style="margin-top:8px">
            <button id="wg-export-btn" class="secondary">导出 wg</button>
<button id="wg-import-btn">导入 wg</button>
<button id="wg-merge-btn" class="secondary">加入 wg</button>
          </div>
          <div id="wg-status" style="font-size:13px;color:var(--muted);min-height:1.2em"></div>
        </div>

        <div class="control-group">
          <h2>导入枚举图</h2>
          <textarea id="import-json-input" rows="5" placeholder='粘贴 JSON（枚举文件或 {nodes:[],edges:[]}）' style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:white;color:var(--ink);font-family:Consolas,monospace;font-size:12px;resize:vertical"></textarea>
          <button id="import-btn" onclick="(function(){var e=document.getElementById('import-json-input'),s=document.getElementById('import-status');if(!e||!e.value.trim()){if(s)s.textContent='请先粘贴JSON。';return}if(s)s.textContent='解析中...';try{var d=JSON.parse(e.value.trim()),g;if(Array.isArray(d.nodes)&&Array.isArray(d.edges))g=d;else if(d.graph&&Array.isArray(d.graph.nodes))g=d.graph;else if(d.ratios&&typeof d.ratios==='object'){var en=Object.values(d.ratios);if(en.length===0)throw Error('ratios为空');g=en[0].graph;if(!g)throw Error('ratios首条无graph字段')}else throw Error('格式不识别');if(!Array.isArray(g.nodes)||!Array.isArray(g.edges))throw Error('nodes/edges非数组');try{window._importGraph&&window._importGraph(g);if(s)s.textContent='已导入('+g.nodes.length+'节点/'+g.edges.length+'条边)'}catch(x){if(s)s.textContent='导入失败:'+x.message}}catch(x){if(s)s.textContent='解析失败:'+x.message}})();return false">导入</button>
          <div id="import-status" style="font-size:13px;color:var(--muted);min-height:1.2em"></div>
        </div>

        <div class="control-group">
          <h2>本地存档</h2>
          <div class="stack">
            <input id="save-name-input" type="text" placeholder="输入图名称" />
            <select id="save-list" size="5"></select>
          </div>
        </div>

        <div class="buttons">
          <button id="save-btn">保存</button>
          <button id="load-btn" class="secondary">加载</button>
          <button id="rename-btn">重命名</button>
          <button id="delete-save-btn" class="secondary">删除存档</button>
        </div>
      </aside>

      <main class="panel graph-panel">
        <div class="graph-wrap">
          <svg id="graph" viewBox="0 0 900 560" aria-label="Conveyor graph"></svg>
        </div>
        <button id="layout-toggle-btn" class="secondary" style="display:none;position:absolute;top:10px;left:10px;z-index:10;font-size:12px;padding:4px 10px;border-radius:8px">查看物理结构</button>
        <div id="layout-overlay" style="display:none;position:absolute;inset:0;background:#fffdf7;z-index:5;overflow:hidden;box-sizing:border-box">
          <iframe id="layout-frame" src="/layout-editor.html" style="width:100%;height:100%;border:none;display:block" title="物理布局预览"></iframe>
        </div>
      </main>

      <aside class="panel inspector">
        <hr style="margin:0 0 14px;border:none;border-top:1px solid var(--line)" />
        <h2>物理布局 (TopoFlow)</h2>
        <div class="buttons">
          <button id="layout-btn">计算物理布局</button>
        </div>
        <div id="layout-status" style="font-size:13px;color:var(--muted);min-height:1.2em"></div>
        <div class="buttons" style="margin-top:4px">
          <button id="layout-export-btn" class="secondary">导出布局</button>
          <button id="layout-import-btn" class="secondary">导入布局</button>
        </div>
        <input id="layout-import-file" type="file" accept=".json" hidden />

        <hr style="margin:14px 0;border:none;border-top:1px solid var(--line)" />
        <h2>标准分流计算</h2>
        <div class="buttons">
          <input id="ratio-p" type="number" min="1" value="1" style="width:72px" placeholder="p" title="目标比例分子 p" />
          <span style="color:var(--muted)">:</span>
          <input id="ratio-q" type="number" min="2" value="3" style="width:72px" placeholder="q" title="目标比例分母 q" />
          <button id="ratio-split-btn">解算比例二分</button>
        </div>
        <div id="ratio-status" style="font-size:13px;color:var(--muted);min-height:1.2em"></div>

        <hr style="margin:14px 0;border:none;border-top:1px solid var(--line)" />
        <h2>精确构造 (p/q 阻塞流)</h2>
        <div class="buttons">
          <input id="construct-p" type="number" min="1" value="325" style="width:72px" placeholder="p" title="目标流量分子 p" />
          <span style="color:var(--muted)">:</span>
          <input id="construct-q" type="number" min="2" value="799" style="width:72px" placeholder="q" title="目标流量分母 q" />
          <button id="construct-btn">构造</button>
        </div>
        <div class="solver-options inline-row" style="margin-top:8px">
          <div class="inline-input">
            <span>规约深度</span>
            <input id="construct-depth" type="number" min="1" max="8" value="3" />
          </div>
          <div class="inline-input">
            <span>优化</span>
            <label class="checkbox-row" style="font-size:13px">
              <input id="construct-optimize" type="checkbox" style="width:auto" /> 深搜
            </label>
            <label class="checkbox-row" style="font-size:13px">
              <input id="construct-crosscheck" type="checkbox" style="width:auto" /> Rust 复核
            </label>
          </div>
        </div>
        <div id="construct-status" style="font-size:13px;color:var(--muted);min-height:1.2em"></div>
        <div id="construct-info" class="history-box" style="display:none;font-size:12px"></div>
      </aside>
    </div>

    <script src="./app.js?v=2"></script>
  </body>
</html>
