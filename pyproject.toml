[project]
name = "topoflow"
version = "0.2.0"
description = "Unified topology flow workbench: MILP/Karzanov solvers, discrete simulation, exact constructor, and physical layout"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "topoflow_native"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
exclude = ["\\.venv/"]

[[tool.mypy.overrides]]
module = ["topoflow_native"]
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
stubPath = "typings"
exclude = [".venv", "native", "**/__pycache__"]
